<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library System - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
    <div class="container navbar-inner">
        <h1 class="logo">Library System</h1>
        <div id="nav-user" class="nav-user">Guest</div>
        <button id="nav-logout" class="btn secondary" onclick="logout()">Logout</button>
    </div>
</nav>
<div class="container">
    <div class="card">
        <div class="dashboard-header">
            <h2 id="dashboard-title">Dashboard</h2>
            <button class="btn" onclick="displayBooks()">Refresh Books</button>
        </div>

        <div class="table-container">
            <table class="book-table" id="book-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Category</th>
                        <th>ISBN</th>
                        <th>Status</th>
                        <th>Due Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="book-list"></tbody>
            </table>
        </div>
    </div>
</div>
<script src="script.js"></script>
<script>initDashboardPage();</script>
</body>
</html>
