<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library System - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" style="max-width: 480px; margin-top: 80px;">
    <div class="card">
        <h2>Login</h2>
        <div style="display:grid; gap:10px; margin-top:12px;">
            <button class="btn" id="admin-login" onclick="login('admin')">Admin Login</button>
            <button class="btn" id="student-login" onclick="login('student')">Student Login</button>
        </div>
        <p style="margin-top: 14px; color: #555;">Enter your user role and ID in the popup prompt.</p>
        <p id="login-message" style="color:#b00020;"></p>
    </div>
</div>
<script src="script.js"></script>
<script>initLoginPage();</script>
</body>
</html>
